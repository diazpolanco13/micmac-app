<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="16" cy="16" r="15" fill="url(#grad1)" stroke="#1E40AF" stroke-width="1"/>
  
  <!-- Letra M estilizada (MIC MAC) -->
  <path d="M8 12 L12 12 L14 18 L16 12 L18 18 L20 12 L24 12 L24 22 L22 22 L22 16 L20 20 L16 20 L12 20 L10 16 L10 22 L8 22 Z" 
        fill="white" 
        stroke="none"/>
  
  <!-- Elemento de análisis prospectivo (flecha hacia adelante) -->
  <path d="M20 8 L24 12 L20 16 L18 14 L20 12 L18 10 Z" 
        fill="url(#grad2)" 
        stroke="none"/>
  
  <!-- Puntos de conexión (representando red/análisis) -->
  <circle cx="12" cy="8" r="1.5" fill="#10B981"/>
  <circle cx="20" cy="24" r="1.5" fill="#10B981"/>
  <circle cx="8" cy="20" r="1.5" fill="#10B981"/>
  
  <!-- Líneas de conexión sutiles -->
  <line x1="12" y1="8" x2="16" y2="12" stroke="#10B981" stroke-width="0.5" opacity="0.6"/>
  <line x1="16" y1="20" x2="20" y2="24" stroke="#10B981" stroke-width="0.5" opacity="0.6"/>
</svg>
